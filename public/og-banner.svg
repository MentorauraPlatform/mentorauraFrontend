<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="auraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFA048"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Top Accent Glow Line -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#auraGlow)"/>

  <!-- Background Decorative Glowing Circles -->
  <circle cx="260" cy="315" r="280" fill="#FF6B00" opacity="0.08"/>
  <circle cx="260" cy="315" r="180" fill="#FF852D" opacity="0.06"/>

  <!-- Embedded Logo Card Box on Left (x: 100, y: 145, w: 340, h: 340) -->
  <g transform="translate(100, 145)">
    <!-- Logo Container Card -->
    <rect width="340" height="340" rx="48" fill="url(#cardBg)" stroke="#334155" stroke-width="3"/>
    
    <!-- Logo Icon Scaled Inside Card -->
    <g transform="translate(45, 45) scale(0.488)">
      <circle cx="256" cy="256" r="190" fill="none" stroke="#FF6B00" stroke-width="14" opacity="0.3" stroke-dasharray="16 12"/>
      <circle cx="256" cy="256" r="160" fill="none" stroke="#FFA048" stroke-width="8" opacity="0.5"/>
      <path d="M128 368 V 168 L 224 288 L 320 168 V 368" stroke="url(#auraGlow)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M384 144 L394 168 L418 178 L394 188 L384 212 L374 188 L350 178 L374 168 Z" fill="#FF6B00"/>
    </g>
  </g>

  <!-- Right Side Text Area (x: 490) -->
  <g transform="translate(490, 0)">
    <!-- Category Badge Pill -->
    <rect x="0" y="175" width="310" height="42" rx="21" fill="#FF6B00" opacity="0.15" stroke="#FF6B00" stroke-width="1.5"/>
    <text x="20" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FF6B00" letter-spacing="1.5">1-ON-1 MENTORSHIP PLATFORM</text>

    <!-- Main Title "MentorAura" -->
    <text x="0" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="-1">Mentor<tspan fill="url(#auraGlow)">Aura</tspan></text>

    <!-- Subtitle Description -->
    <text x="0" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#94A3B8">Connect 1-on-1 with verified tech leaders,</text>
    <text x="0" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#94A3B8">senior software engineers, and product executives.</text>

    <!-- Domain Footer Badge -->
    <text x="0" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#64748B">mentoraura.com</text>
  </g>
</svg>
